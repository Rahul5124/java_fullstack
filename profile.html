<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EatNow - Profile</title>
    <link rel="icon" href="img/logo.png">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; text-align: center; padding: 20px; animation: fadeIn 1s ease-in-out; }
        .container { background: white; padding: 20px; border-radius: 8px; width: 50%; margin: auto; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        button { padding: 10px; background-color: #ff5733; color: white; border: none; cursor: pointer; }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <h1>User Profile</h1>
    <div class="container">
        <p><strong>Name:</strong> <span id="user-name">Loading...</span></p>
        <p><strong>Email:</strong> <span id="user-email">Loading...</span></p>
        <button onclick="logout()">Logout</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const token = localStorage.getItem("token");

            if (!token) {
                alert("Please log in first!");
                window.location.href = "index.html";
                return;
            }

            try {
                const response = await fetch("server running at http://localhost:5000//api/auth//login", {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    }
                });

                if (!response.ok) {
                    throw new Error("Failed to fetch user data.");
                }

                const user = await response.json();
                document.getElementById("user-name").textContent = user.name;
                document.getElementById("user-email").textContent = user.email;
            } catch (error) {
                console.error("Error fetching user data:", error);
                alert("Session expired! Please log in again.");
                localStorage.removeItem("token");
                window.location.href = "index.html";
            }
        });

        async function logout() {
            const token = localStorage.getItem("token");

            await fetch("http://your-api-url.com/api/logout", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            });

            localStorage.removeItem("token");
            localStorage.removeItem("user");
            alert("Logged out successfully!");
            window.location.href = "login.html";
        }

        document.addEventListener("DOMContentLoaded", function() {
            const savedTheme = localStorage.getItem("theme") || "light";
            document.body.classList.toggle("dark-mode", savedTheme === "dark");
        });
    </script>

</body>
</html>
